<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Prediction System</title>
    <style>
        body {
            font-family: monospace;
            background: linear-gradient(135deg, #0a0e27, #1a1a3e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .error-box {
            text-align: center;
            padding: 3rem;
            background: rgba(231, 76, 60, 0.2);
            border-radius: 24px;
            border: 1px solid #e74c3c;
        }
        h1 { color: #e74c3c; margin-bottom: 1rem; }
        a { color: #4a80e5; text-decoration: none; margin-top: 1rem; display: inline-block; }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>⚠️ Prediction Error</h1>
        <p>{{ error_message }}</p>
        <a href="/">← Return to Home</a>
    </div>
</body>
</html>
